server:
  port: ${BOARD_PORT:8080}
  servlet:
    session:
      timeout: 8h
      cookie:
        http-only: true
        same-site: lax
        name: JSESSIONID

spring:
  application:
    name: board
  datasource:
    url: ${BOARD_DB_URL:jdbc:h2:file:./data/board;DB_CLOSE_DELAY=-1}
    driver-class-name: org.h2.Driver
    username: ${BOARD_DB_USERNAME:sa}
    password: ${BOARD_DB_PASSWORD:}
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:schema.sql
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: always

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

board:
  admin:
    username: ${BOARD_ADMIN_USERNAME:admin}
    display-name: ${BOARD_ADMIN_DISPLAY_NAME:管理员}
    password: ${BOARD_ADMIN_PASSWORD:admin123}
