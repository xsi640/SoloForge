# 团队任务看板 · 服务器外置配置样例
#
# 用法：复制到 /opt/board/application.yml，与 board.jar 放在同一目录，重启服务后生效。
# 键名与 code/backend/src/main/resources/application.yml 保持一致，本文件按项覆盖打包内默认值。
# 每项都可以用 ${环境变量:默认值} 的形式被环境变量覆盖，环境变量的用法见 board.service 的 Environment 段。
# 本文件未列出的配置项（如 mybatis、spring.sql.init）沿用打包内的默认值。
# 使用默认值时无需改动本文件，只改 board.admin.password 一项即可上线。

server:
  # 页面与 /api 共用的唯一端口。环境变量：BOARD_PORT
  port: ${BOARD_PORT:8080}
  servlet:
    session:
      # 会话保存在服务端内存中，有效期 8 小时，服务重启后所有人需重新登录。
      timeout: 8h
      cookie:
        name: JSESSIONID
        http-only: true
        # 内网使用 HTTP，不设置 Secure，因此显式声明 SameSite。
        same-site: lax

spring:
  datasource:
    # 数据库位置，相对工作目录，实际文件为 <工作目录>/data/board.mv.db。环境变量：BOARD_DB_URL
    # 工作目录由 board.service 的 WorkingDirectory 指定为 /opt/board，因此数据落在 /opt/board/data/。
    # 用 shell 传该值时需整体加引号，因为连接串里含分号。
    url: "${BOARD_DB_URL:jdbc:h2:file:./data/board;DB_CLOSE_DELAY=-1}"
    driver-class-name: org.h2.Driver
    # 环境变量：BOARD_DB_USERNAME / BOARD_DB_PASSWORD
    username: ${BOARD_DB_USERNAME:sa}
    password: ${BOARD_DB_PASSWORD:}
  h2:
    console:
      # 内网部署也不开放数据库控制台，确需排障时临时改为 true 并重启，用完立即改回。
      enabled: false
  jackson:
    time-zone: Asia/Shanghai

board:
  admin:
    # 首次启动时若用户表为空，用以下三项自动创建第一个管理员。
    # 密码以明文写在配置文件里，部署前必须改掉，首次登录后立即重置。环境变量：BOARD_ADMIN_USERNAME
    username: ${BOARD_ADMIN_USERNAME:admin}
    # 管理员在看板上显示的名称。环境变量：BOARD_ADMIN_DISPLAY_NAME
    display-name: ${BOARD_ADMIN_DISPLAY_NAME:管理员}
    # 初始密码，默认值仅供本机试跑，上线前必须替换。环境变量：BOARD_ADMIN_PASSWORD
    password: ${BOARD_ADMIN_PASSWORD:admin123}
